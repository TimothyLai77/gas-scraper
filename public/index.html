<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gas Price Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181a24;
      --text: #e5e7eb;
      --muted: #8b8fa3;
      --up: #ef4444;
      --down: #22c55e;
      --same: #6b7280;
      --accent: #6366f1;
      --error-bg: #7f1d1d;
      --error-text: #fecaca;
    }

    [data-theme="light"] {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --up: #dc2626;
      --down: #16a34a;
      --same: #9ca3af;
      --accent: #4f46e5;
      --error-bg: #fef2f2;
      --error-text: #dc2626;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--muted);
      color: var(--muted);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .tomorrow-section {
      text-align: center;
    }

    .tomorrow-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .tomorrow-price {
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .tomorrow-unit {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .trend-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.75rem;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .trend-badge.up { background: rgba(239, 68, 68, 0.15); color: var(--up); }
    .trend-badge.down { background: rgba(34, 197, 94, 0.15); color: var(--down); }
    .trend-badge.same { background: rgba(107, 114, 128, 0.15); color: var(--same); }

    .today-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .today-label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .today-price {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .refresh-btn {
      background: none;
      border: 1px solid var(--muted);
      color: var(--muted);
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-banner {
      background: var(--error-bg);
      color: var(--error-text);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      display: none;
      margin-bottom: 1rem;
    }

    .error-banner.visible {
      display: block;
    }

    .loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Toronto Gas Price</h1>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
    </header>

    <div id="errorBanner" class="error-banner"></div>

    <div id="dashboard" class="loading">
      <div class="card tomorrow-section">
        <div class="tomorrow-label">Tomorrow</div>
        <div class="tomorrow-price">--</div>
        <div class="tomorrow-unit">¢ / litre</div>
        <div id="trendBadge" class="trend-badge same">--</div>
      </div>

      <div class="card today-section">
        <div>
          <div class="today-label">Today</div>
          <div class="today-price">--</div>
        </div>
        <div class="today-label">¢/L</div>
      </div>

      <div class="status-bar">
        <span id="lastScrape">Last update: --</span>
        <button id="refreshBtn" class="refresh-btn">Refresh</button>
      </div>
    </div>
  </div>

  <script>
    const els = {
      tomorrowPrice: document.querySelector('.tomorrow-price'),
      tomorrowLabel: document.querySelector('.tomorrow-label'),
      trendBadge: document.getElementById('trendBadge'),
      todayPrice: document.querySelector('.today-price'),
      lastScrape: document.getElementById('lastScrape'),
      errorBanner: document.getElementById('errorBanner'),
      refreshBtn: document.getElementById('refreshBtn'),
      dashboard: document.getElementById('dashboard'),
      themeToggle: document.getElementById('themeToggle'),
    };

    function initTheme() {
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = stored || (prefersDark ? 'dark' : 'light');
      applyTheme(theme);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      els.themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
      localStorage.setItem('theme', theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    async function fetchData() {
      els.dashboard.classList.add('loading');
      els.refreshBtn.disabled = true;
      els.errorBanner.classList.remove('visible');

      try {
        const res = await fetch('/api');
        const json = await res.json();

        if (json.error && !json.data) {
          showError(json.error);
          return;
        }

        if (json.error) {
          showError(json.error + ' (showing last known data)');
        }

        const d = json.data;
        els.tomorrowLabel.textContent = formatLabel(d.dateTomorrow, 'Tomorrow');
        els.tomorrowPrice.textContent = d.priceTomorrow;
        els.todayPrice.textContent = d.priceToday;
        setTrend(d.delta);
        els.lastScrape.textContent = 'Last update: ' + formatTime(json.lastScrapeTime);
      } catch (err) {
        showError('Failed to fetch data');
      } finally {
        els.dashboard.classList.remove('loading');
        els.refreshBtn.disabled = false;
      }
    }

    function setTrend(delta) {
      if (delta > 0) {
        els.trendBadge.className = 'trend-badge up';
        els.trendBadge.textContent = `▲ +${delta}¢ tomorrow`;
      } else if (delta < 0) {
        els.trendBadge.className = 'trend-badge down';
        els.trendBadge.textContent = `▼ ${delta}¢ tomorrow`;
      } else {
        els.trendBadge.className = 'trend-badge same';
        els.trendBadge.textContent = '→ unchanged';
      }
    }

    function showError(msg) {
      els.errorBanner.textContent = '⚠ ' + msg;
      els.errorBanner.classList.add('visible');
    }

    function formatLabel(dateStr, fallback) {
      if (!dateStr) return fallback;
      const [d, m, y] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) || fallback;
    }

    function formatTime(iso) {
      if (!iso) return '--';
      try {
        const date = new Date(iso);
        return date.toLocaleString('en-US', {
          month: 'short', day: 'numeric',
          hour: 'numeric', minute: '2-digit'
        });
      } catch {
        return '--';
      }
    }

    els.refreshBtn.addEventListener('click', fetchData);
    els.themeToggle.addEventListener('click', toggleTheme);

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) {
        applyTheme(e.matches ? 'dark' : 'light');
      }
    });

    initTheme();
    fetchData();
  </script>
</body>
</html>
