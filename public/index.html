<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gas Price Dashboard</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --text: #e0e0e0;
      --muted: #666666;
      --up: #ef4444;
      --down: #22c55e;
      --same: #555555;
      --accent: #888888;
      --error-bg: #1a0a0a;
      --error-text: #ff6b6b;
    }

    [data-theme="light"] {
      --bg: #f0f0f0;
      --surface: #f7f7f7;
      --text: #111111;
      --muted: #777777;
      --up: #c00000;
      --down: #007a00;
      --same: #888888;
      --accent: #555555;
      --error-bg: #fff0f0;
      --error-text: #c00000;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .theme-toggle {
      background: none;
      border: 1px solid #333333;
      color: var(--muted);
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .card {
      background: var(--surface);
      border: 1px solid #222222;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .price-comparison {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price-column {
      flex: 1;
    }

    .price-column.today {
      text-align: left;
    }

    .price-column.tomorrow {
      text-align: right;
    }

    .price-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .price-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .price-unit {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .trend-indicator {
      flex: 0.5;
      text-align: center;
      font-size: 1.5rem;
      padding: 0 0.5rem;
    }

    .trend-indicator.up { color: var(--up); }
    .trend-indicator.down { color: var(--down); }
    .trend-indicator.same { color: var(--same); }

    .trend-badge {
      display: block;
      text-align: center;
      margin-top: 1rem;
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid currentColor;
    }

    .trend-badge.up { background: rgba(239, 68, 68, 0.15); color: var(--up); }
    .trend-badge.down { background: rgba(34, 197, 94, 0.15); color: var(--down); }
    .trend-badge.same { background: rgba(107, 114, 128, 0.15); color: var(--same); }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .refresh-btn {
      background: none;
      border: 1px solid #333333;
      color: var(--muted);
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-banner {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-text);
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      display: none;
      margin-bottom: 1rem;
    }

    .error-banner.visible {
      display: block;
    }

    .loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 2rem;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid #222222;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .chart-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .chart-wrapper {
      position: relative;
      height: 200px;
    }

    .chart-empty {
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      padding: 1.5rem 0;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Toronto Gas Price</h1>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
    </header>

    <div id="errorBanner" class="error-banner"></div>

    <div id="dashboard" class="loading">
      <div class="card">
        <div class="price-comparison">
          <div class="price-column today">
            <div class="price-label">Today</div>
            <div id="todayPrice" class="price-value">--</div>
            <div class="price-unit">¢ / L</div>
          </div>

          <div id="trendIndicator" class="trend-indicator same">→</div>

          <div class="price-column tomorrow">
            <div class="price-label">Tomorrow</div>
            <div id="tomorrowPrice" class="price-value">--</div>
            <div class="price-unit">¢ / L</div>
          </div>
        </div>

        <div id="trendBadge" class="trend-badge same">--</div>
      </div>

      <div class="status-bar">
        <span id="lastScrape">Last update: --</span>
        <button id="refreshBtn" class="refresh-btn">Refresh</button>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-label">Last 30 Days</div>
      <div class="chart-wrapper">
        <canvas id="priceChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const els = {
      tomorrowPrice: document.getElementById('tomorrowPrice'),
      tomorrowLabel: document.querySelector('.price-column.tomorrow .price-label'),
      trendBadge: document.getElementById('trendBadge'),
      trendIndicator: document.getElementById('trendIndicator'),
      todayPrice: document.getElementById('todayPrice'),
      lastScrape: document.getElementById('lastScrape'),
      errorBanner: document.getElementById('errorBanner'),
      refreshBtn: document.getElementById('refreshBtn'),
      dashboard: document.getElementById('dashboard'),
      themeToggle: document.getElementById('themeToggle'),
    };

    let priceChart = null;

    function initTheme() {
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = stored || (prefersDark ? 'dark' : 'light');
      applyTheme(theme);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      els.themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
      localStorage.setItem('theme', theme);
      if (priceChart) {
        fetch('/api/history').then(r => r.json()).then(renderChart);
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    async function fetchData() {
      els.dashboard.classList.add('loading');
      els.refreshBtn.disabled = true;
      els.errorBanner.classList.remove('visible');

      try {
        const [apiRes, histRes] = await Promise.all([
          fetch('/api'),
          fetch('/api/history')
        ]);

        const json = await apiRes.json();
        const history = await histRes.json();

        if (json.error && !json.data) {
          showError(json.error);
          return;
        }

        if (json.error) {
          showError(json.error + ' (showing last known data)');
        }

        const d = json.data;
        els.tomorrowPrice.textContent = d.priceTomorrow;
        els.todayPrice.textContent = d.priceToday;
        setTrend(d.delta);
        els.lastScrape.textContent = 'Last update: ' + formatTime(json.lastScrapeTime);
        renderChart(history);
      } catch (err) {
        showError('Failed to fetch data');
      } finally {
        els.dashboard.classList.remove('loading');
        els.refreshBtn.disabled = false;
      }
    }

    function setTrend(delta) {
      if (delta > 0) {
        els.trendBadge.className = 'trend-badge up';
        els.trendBadge.textContent = `▲ +${delta}¢ tomorrow`;
        els.trendIndicator.className = 'trend-indicator up';
        els.trendIndicator.textContent = '▲';
      } else if (delta < 0) {
        els.trendBadge.className = 'trend-badge down';
        els.trendBadge.textContent = `▼ ${delta}¢ tomorrow`;
        els.trendIndicator.className = 'trend-indicator down';
        els.trendIndicator.textContent = '▼';
      } else {
        els.trendBadge.className = 'trend-badge same';
        els.trendBadge.textContent = '→ unchanged';
        els.trendIndicator.className = 'trend-indicator same';
        els.trendIndicator.textContent = '→';
      }
    }

    function showError(msg) {
      els.errorBanner.textContent = '⚠ ' + msg;
      els.errorBanner.classList.add('visible');
    }

    function renderChart(records) {
      if (records.length === 0) return;

      const ctx = document.getElementById('priceChart').getContext('2d');
      const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
      const gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
      const tickColor = isDark ? '#8b8fa3' : '#6b7280';

      if (priceChart) {
        priceChart.destroy();
      }

      const labels = records.map(r => {
        const [y, m, d] = r.date.split('-');
        return `${m}/${d}`;
      });

      priceChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Price',
            data: records.map(r => r.priceTomorrow),
            borderColor: '#888888',
            backgroundColor: 'rgba(136,136,136,0.1)',
            borderWidth: 2,
            pointRadius: 2,
            pointHoverRadius: 5,
            fill: true,
            tension: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => ctx.parsed.y + '¢/L'
              }
            }
          },
          scales: {
            x: {
              grid: { color: gridColor },
              ticks: { color: tickColor, maxTicksLimit: 8 },
              title: { display: true, text: 'Date', color: tickColor, font: { size: 10 } }
            },
            y: {
              grid: { color: gridColor },
              ticks: { color: tickColor },
              title: { display: true, text: '¢/L', color: tickColor, font: { size: 10 } }
            }
          }
        }
      });
    }

    function formatLabel(dateStr, fallback) {
      if (!dateStr) return fallback;
      const [d, m, y] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) || fallback;
    }

    function formatTime(iso) {
      if (!iso) return '--';
      try {
        const date = new Date(iso);
        return date.toLocaleString('en-US', {
          month: 'short', day: 'numeric',
          hour: 'numeric', minute: '2-digit'
        });
      } catch {
        return '--';
      }
    }

    els.refreshBtn.addEventListener('click', fetchData);
    els.themeToggle.addEventListener('click', toggleTheme);

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) {
        applyTheme(e.matches ? 'dark' : 'light');
      }
    });

    initTheme();
    fetchData();
  </script>
</body>
</html>
